[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-task-forge"
version = "0.1.0"
description = "Build validated synthetic-data packages with separated solver and reviewer artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Waleed Khan"}]
dependencies = []

[project.scripts]
task-forge = "task_forge.cli:main"

[tool.setuptools.packages.find]
include = ["task_forge*"]
